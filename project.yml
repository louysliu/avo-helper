name: AvoHelper
options:
  bundleIdPrefix: com.louis
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
packages:
  StitchingKit:
    path: Packages/StitchingKit
targets:
  AvoHelper:
    type: application
    platform: iOS
    sources:
      - path: AvoHelper
    dependencies:
      - package: StitchingKit
        product: StitchingEngines
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.louis.AvoHelper
        PRODUCT_NAME: AvoHelper
        INFOPLIST_FILE: AvoHelper/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - AvoHelperTests
        - AvoHelperUITests
      gatherCoverageData: true
  AvoHelperTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AvoHelperTests
    dependencies:
      - target: AvoHelper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.louis.AvoHelperTests
        GENERATE_INFOPLIST_FILE: YES
  AvoHelperUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AvoHelperUITests
    dependencies:
      - target: AvoHelper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.louis.AvoHelperUITests
        GENERATE_INFOPLIST_FILE: YES
