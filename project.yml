name: AvoHelper
options:
  bundleIdPrefix: com.louis
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
  configs:
    Release:
      CLANG_ENABLE_CODE_COVERAGE: NO
      GCC_GENERATE_TEST_COVERAGE_FILES: NO
      GCC_INSTRUMENT_PROGRAM_FLOW_ARCS: NO
packages:
  VideoStitchingKit:
    path: Packages/VideoStitchingKit
  StitchingKit:
    path: Packages/StitchingKit
targets:
  AvoHelper:
    type: application
    platform: iOS
    sources:
      - path: AvoHelper
    dependencies:
      - package: VideoStitchingKit
        product: VideoStitchingCore
      - package: VideoStitchingKit
        product: LongScreenVideo
      - package: VideoStitchingKit
        product: HyprLongshotVideo
      - package: StitchingKit
        product: StitchingEngines
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.louis.AvoHelper
        PRODUCT_NAME: AvoHelper
        INFOPLIST_FILE: AvoHelper/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - AvoHelperTests
        - AvoHelperUITests
      gatherCoverageData: false
  AvoHelperTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AvoHelperTests
    dependencies:
      - target: AvoHelper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.louis.AvoHelperTests
        GENERATE_INFOPLIST_FILE: YES
  AvoHelperUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AvoHelperUITests
    dependencies:
      - target: AvoHelper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.louis.AvoHelperUITests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  AvoHelper-Coverage:
    build:
      targets:
        AvoHelper: all
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - AvoHelperTests
        - AvoHelperUITests
